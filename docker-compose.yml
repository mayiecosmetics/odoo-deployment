services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Odoo database backend
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15
    container_name: mayie-odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - odoo-network

  # ---------------------------------------------------------------------------
  # Enterprise addons fetcher — clones/updates github.com/odoo/enterprise
  # ---------------------------------------------------------------------------
  # Runs on every deploy. Skips silently if no token is set (Community mode).
  # Token + version come from Coolify env vars, never written to git.
  # ---------------------------------------------------------------------------
  enterprise-fetcher:
    image: alpine/git:latest
    container_name: mayie-enterprise-fetcher
    restart: "no"
    environment:
      ODOO_ENTERPRISE_GITHUB_TOKEN: ${ODOO_ENTERPRISE_GITHUB_TOKEN:-}
      ODOO_VERSION: ${ODOO_VERSION:-19.0}
      # Pin enterprise to the commit matching the Odoo core build in the Dockerfile
      # (core 19.0-20260528 <-> enterprise 88d2e934e of 2026-06-06). Bump BOTH
      # together on a planned upgrade; a floating branch head breaks the registry
      # on every deploy/restart (outage of 2026-09-15).
      ODOO_ENTERPRISE_REF: ${ODOO_ENTERPRISE_REF:-88d2e934eaf7eb37f72732bc1b9c1593a3ba1577}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /enterprise
        # Fault-tolerant by design (same contract as custom-fetcher below): the
        # odoo service waits on this one with service_completed_successfully, so
        # a non-zero exit here takes the WHOLE stack down. An expired token, a
        # GitHub outage or a DNS hiccup must never do that when the volume
        # already holds a usable checkout. Hard failure is only acceptable when
        # there is nothing to fall back to.
        if [ -d .git ]; then HAD_CHECKOUT=1; else HAD_CHECKOUT=0; fi
        if [ -z "$$ODOO_ENTERPRISE_GITHUB_TOKEN" ]; then
          if [ "$$HAD_CHECKOUT" = "1" ]; then
            echo "No GitHub token set — keeping existing enterprise addons."
          else
            echo "No GitHub token set — skipping enterprise fetch (Community mode)."
          fi
          exit 0
        fi
        REPO_URL="https://$$ODOO_ENTERPRISE_GITHUB_TOKEN@github.com/odoo/enterprise.git"
        if [ "$$HAD_CHECKOUT" = "1" ]; then
          # Always refresh the remote URL (token rotation) so a LATER fetch works,
          # even on the fast path below where we do not fetch at all. `set-url`
          # fails when the volume holds a repo with no origin — add it instead.
          git remote set-url origin "$$REPO_URL" 2>/dev/null || git remote add origin "$$REPO_URL"
        else
          echo "Cloning enterprise addons (branch $$ODOO_VERSION)..."
          if ! git clone --branch "$$ODOO_VERSION" --single-branch --depth 1 "$$REPO_URL" .; then
            echo "ERROR: enterprise clone failed and no existing addons to fall back to."
            exit 1
          fi
        fi
        if [ -n "$$ODOO_ENTERPRISE_REF" ]; then
          if git cat-file -e "$$ODOO_ENTERPRISE_REF^{commit}" 2>/dev/null; then
            # FAST PATH — the pinned commit is already in the volume. Nothing
            # about it can change, so do NOT touch the network: a dead token or
            # a GitHub outage must not be able to block a restart.
            echo "Pinned commit $$ODOO_ENTERPRISE_REF already present — skipping fetch (offline-safe restart)."
            git reset --hard "$$ODOO_ENTERPRISE_REF"
            git clean -fd
          else
            echo "Pinned commit $$ODOO_ENTERPRISE_REF not in volume — fetching from origin..."
            if git fetch --depth 1 origin "$$ODOO_ENTERPRISE_REF" || git fetch origin "$$ODOO_VERSION"; then
              git reset --hard "$$ODOO_ENTERPRISE_REF"
              git clean -fd
            elif [ "$$HAD_CHECKOUT" = "1" ]; then
              echo "################################################################"
              echo "WARNING: could not fetch pinned enterprise commit"
              echo "WARNING:   $$ODOO_ENTERPRISE_REF"
              echo "WARNING: (expired ODOO_ENTERPRISE_GITHUB_TOKEN / GitHub outage / DNS?)"
              echo "WARNING: Keeping the EXISTING enterprise checkout so the stack still"
              echo "WARNING: starts. The addons may NOT match the pinned core build —"
              echo "WARNING: fix the token/network and redeploy."
              echo "################################################################"
              exit 0
            else
              echo "ERROR: pinned enterprise commit unreachable and the volume was empty."
              exit 1
            fi
          fi
        else
          echo "No ODOO_ENTERPRISE_REF set — tracking branch head $$ODOO_VERSION (NOT recommended)."
          if git fetch origin "$$ODOO_VERSION"; then
            git reset --hard "origin/$$ODOO_VERSION"
            git clean -fd
          elif [ "$$HAD_CHECKOUT" = "1" ]; then
            echo "WARNING: fetch failed (expired token / network?) — keeping existing enterprise addons so the stack still starts."
            exit 0
          else
            echo "ERROR: fetch failed and no existing enterprise addons to fall back to."
            exit 1
          fi
        fi
        echo "Enterprise addons ready."
    volumes:
      - enterprise-addons:/enterprise

  # ---------------------------------------------------------------------------
  # Third-party addons fetcher — clones mayiecosmetics/odoo-third-party-addons
  # ---------------------------------------------------------------------------
  # Public repo, no token needed. Runs on every deploy. Pulls latest changes.
  # Branch comes from THIRD_PARTY_BRANCH env var (default: main).
  # ---------------------------------------------------------------------------
  third-party-fetcher:
    image: alpine/git:latest
    container_name: mayie-third-party-fetcher
    restart: "no"
    environment:
      THIRD_PARTY_REPO: ${THIRD_PARTY_REPO:-https://github.com/mayiecosmetics/odoo-third-party-addons.git}
      THIRD_PARTY_BRANCH: ${THIRD_PARTY_BRANCH:-main}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /third_party
        # Same fault tolerance as the other fetchers: odoo depends on this with
        # service_completed_successfully, so a network blip must not stop the
        # stack when the volume already holds a checkout.
        if [ -d .git ]; then
          echo "Updating third-party addons (branch $$THIRD_PARTY_BRANCH)..."
          git remote set-url origin "$$THIRD_PARTY_REPO" 2>/dev/null || git remote add origin "$$THIRD_PARTY_REPO"
          if git fetch origin "$$THIRD_PARTY_BRANCH" && git reset --hard "origin/$$THIRD_PARTY_BRANCH"; then
            git clean -fd
            echo "Third-party addons updated."
          else
            echo "WARNING: fetch failed (network / repo moved?) — keeping existing third-party addons so the stack still starts."
          fi
        else
          echo "Cloning third-party addons (branch $$THIRD_PARTY_BRANCH)..."
          if ! git clone --branch "$$THIRD_PARTY_BRANCH" --single-branch --depth 1 "$$THIRD_PARTY_REPO" .; then
            echo "ERROR: clone failed and no existing third-party addons to fall back to."
            exit 1
          fi
        fi
        echo "Third-party addons ready."
    volumes:
      - third-party-addons:/third_party

  # ---------------------------------------------------------------------------
  # Custom addons fetcher — clones mayiecosmetics/odoo-custom-addons (private)
  # ---------------------------------------------------------------------------
  # Private repo, requires MAYIE_GITHUB_TOKEN env var (PAT with repo scope).
  # Branch defaults to main; switch to e.g. '20.0' when migrating Odoo versions.
  # ---------------------------------------------------------------------------
  custom-fetcher:
    image: alpine/git:latest
    container_name: mayie-custom-fetcher
    restart: "no"
    environment:
      MAYIE_GITHUB_TOKEN: ${MAYIE_GITHUB_TOKEN:-}
      CUSTOM_REPO_PATH: ${CUSTOM_REPO_PATH:-mayiecosmetics/odoo-custom-addons}
      CUSTOM_BRANCH: ${CUSTOM_BRANCH:-main}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cd /custom
        # Fault-tolerant by design: if the addons volume already has a clone,
        # a failed/expired token (or network blip) must NOT crash the deploy —
        # Odoo keeps running on the existing addons. A hard failure is only
        # acceptable when there is nothing in the volume to fall back to.
        if [ -z "$$MAYIE_GITHUB_TOKEN" ]; then
          if [ -d .git ]; then
            echo "MAYIE_GITHUB_TOKEN not set — keeping existing custom addons."
            exit 0
          fi
          echo "ERROR: MAYIE_GITHUB_TOKEN not set and no existing addons to use."
          exit 1
        fi
        REPO_URL="https://$$MAYIE_GITHUB_TOKEN@github.com/$$CUSTOM_REPO_PATH.git"
        if [ -d .git ]; then
          echo "Updating custom addons (branch $$CUSTOM_BRANCH)..."
          git remote set-url origin "$$REPO_URL"
          if git fetch origin "$$CUSTOM_BRANCH" && git reset --hard "origin/$$CUSTOM_BRANCH"; then
            echo "Custom addons updated."
          else
            echo "WARNING: fetch failed (expired token / network?) — keeping existing custom addons so the stack still starts."
          fi
        else
          echo "Cloning custom addons (branch $$CUSTOM_BRANCH)..."
          if ! git clone --branch "$$CUSTOM_BRANCH" --single-branch --depth 1 "$$REPO_URL" .; then
            echo "ERROR: clone failed and no existing addons present."
            exit 1
          fi
        fi
        echo "Custom addons ready."
    volumes:
      - custom-addons:/custom

  # ---------------------------------------------------------------------------
  # Database backup — pg_dumpall every BACKUP_INTERVAL_HOURS to Hetzner
  # Object Storage (hel1), offsite. MinIO removed 2026-09-19: attachments and
  # backups both live on Hetzner now; this service no longer touches MinIO.
  # ---------------------------------------------------------------------------
  # Runs first backup ~30 s after start, then every N hours. Old backups
  # beyond BACKUP_RETENTION_DAYS are pruned automatically.
  # ---------------------------------------------------------------------------
  db-backup:
    image: alpine:latest
    container_name: mayie-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-odoo-backups}
      BACKUP_BUCKET_HETZNER: ${BACKUP_BUCKET_HETZNER:-mayie-odoo-db-backups}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Sanity floor: a gzipped pg_dumpall of this cluster is far larger than
      # 1 MiB. Anything smaller means a truncated/failed dump — never upload it.
      BACKUP_MIN_BYTES: ${BACKUP_MIN_BYTES:-1048576}
      # Seconds to wait before retrying after a FAILED backup (default 10 min).
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-600}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # pipefail is ESSENTIAL here: busybox ash returns only the LAST command's
        # status for a pipeline, so `pg_dumpall | gzip | rclone` reported success
        # even when pg_dumpall died mid-dump and a truncated archive was stored
        # as a "good" backup. (Verified: busybox ash supports `set -o pipefail`.)
        set -o pipefail
        echo "[$$(date)] Installing tools..."
        apk add --no-cache postgresql-client rclone ca-certificates
        export RCLONE_CONFIG_HETZNER_TYPE=s3 RCLONE_CONFIG_HETZNER_PROVIDER=Other RCLONE_CONFIG_HETZNER_ENDPOINT="$$HETZNER_S3_ENDPOINT" RCLONE_CONFIG_HETZNER_REGION="$$HETZNER_S3_REGION"
        export RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID="$$HETZNER_S3_ACCESS_KEY" RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY="$$HETZNER_S3_SECRET_KEY"
        rclone mkdir "hetzner:$$BACKUP_BUCKET_HETZNER"

        echo "[$$(date)] Waiting 30s for db readiness..."
        sleep 30

        while true; do
          TS=$$(date +%Y-%m-%d_%H-%M-%S)
          FILE="pgdumpall-$$TS.sql.gz"
          TMP="/tmp/$$FILE"
          FAIL=""
          SIZE=0
          rm -f "$$TMP"
          echo "[$$(date)] Starting backup -> $$FILE"

          # 1. Dump to a LOCAL temp file first — never stream straight to object
          #    storage, or a half-written dump becomes a published "backup".
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dumpall -h db -U "$$POSTGRES_USER" --no-password \
            | gzip -9 > "$$TMP" || FAIL="pg_dumpall/gzip pipeline failed (exit $$?)"

          # 2. The gzip stream must be complete and intact.
          if [ -z "$$FAIL" ] && ! gzip -t "$$TMP" 2>/dev/null; then
            FAIL="gzip integrity check failed — dump is truncated or corrupt"
          fi

          # 3. ...and non-trivially sized.
          if [ -z "$$FAIL" ]; then
            SIZE=$$(wc -c < "$$TMP" | tr -d " ")
            if [ "$$SIZE" -lt "$$BACKUP_MIN_BYTES" ]; then
              FAIL="dump is only $$SIZE bytes (< $$BACKUP_MIN_BYTES) — refusing to upload"
            fi
          fi

          # 4. Only a dump that passed every check gets uploaded.
          if [ -z "$$FAIL" ]; then
            rclone copyto "$$TMP" "hetzner:$$BACKUP_BUCKET_HETZNER/$$FILE" || FAIL="rclone upload to Hetzner failed (exit $$?)"
          fi
          rm -f "$$TMP"

          if [ -n "$$FAIL" ]; then
            echo "################################################################"
            echo "[$$(date)] ERROR: BACKUP FAILED — $$FAIL"
            echo "[$$(date)] ERROR: nothing was uploaded for this cycle; the last"
            echo "[$$(date)] ERROR: good backup in the bucket is untouched."
            echo "################################################################"
            # Retry instead of exiting: crashing here would restart-loop the
            # container (restart: unless-stopped) and spam apk on every attempt.
            echo "[$$(date)] Retrying in $${BACKUP_RETRY_SECONDS}s..."
            sleep "$$BACKUP_RETRY_SECONDS"
            continue
          fi

          echo "[$$(date)] Uploaded $$FILE ($$SIZE bytes, gzip verified)"

          echo "[$$(date)] Pruning backups older than $${BACKUP_RETENTION_DAYS} days..."
          rclone delete --min-age "$${BACKUP_RETENTION_DAYS}d" "hetzner:$$BACKUP_BUCKET_HETZNER" || true

          SLEEP_SEC=$$((BACKUP_INTERVAL_HOURS * 3600))
          echo "[$$(date)] Sleeping $${BACKUP_INTERVAL_HOURS}h..."
          sleep "$$SLEEP_SEC"
        done
    networks:
      - odoo-network

  # ---------------------------------------------------------------------------
  # Odoo — ERP application (Community or Enterprise)
  # ---------------------------------------------------------------------------
  # Enterprise addons: clone https://github.com/odoo/enterprise into
  # addons/enterprise/ (requires an active Odoo Enterprise subscription).
  # If the directory is empty or absent, Odoo runs in Community mode.
  # ---------------------------------------------------------------------------
  # Config is generated at startup from config/odoo.conf.template via envsubst.
  # Secrets are injected from .env — never committed to Git.
  # ---------------------------------------------------------------------------
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mayie-odoo-app
    labels:
      # Coolify attaches this service to two networks (its own odoo-network and
      # the app network the proxy lives on). Without this hint Traefik may pick
      # the wrong one and answer 504/000 intermittently.
      - traefik.docker.network=w75tkzcbr7om152wupubem1r
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      enterprise-fetcher:
        condition: service_completed_successfully
      third-party-fetcher:
        condition: service_completed_successfully
      custom-fetcher:
        condition: service_completed_successfully
    expose:
      - "8069"
      - "8072"
    environment:
      # Database
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Set ODOO_ADMIN_PASSWORD in .env}
      # Odoo tuning (overridable in .env)
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-False}
      ODOO_LOG_LEVEL: ${ODOO_LOG_LEVEL:-info}
      ODOO_WORKERS: ${ODOO_WORKERS:-0}
      ODOO_CRON_THREADS: ${ODOO_CRON_THREADS:-1}
      ODOO_LIST_DB: ${ODOO_LIST_DB:-True}
      ODOO_LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-2684354560}
      ODOO_LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-2147483648}
      ODOO_LIMIT_TIME_CPU: ${ODOO_LIMIT_TIME_CPU:-60}
      ODOO_LIMIT_TIME_REAL: ${ODOO_LIMIT_TIME_REAL:-120}
    command: >
      sh -c "
        ADDONS_PATH='/mnt/extra-addons/custom,/mnt/extra-addons/third_party'
        if [ -n \"\$(ls -A /mnt/extra-addons/enterprise 2>/dev/null)\" ]; then
          ADDONS_PATH='/mnt/extra-addons/enterprise,'$$ADDONS_PATH
        fi
        export ADDONS_PATH
        export ODOO_PROXY_MODE=$${ODOO_PROXY_MODE:-False}
        export ODOO_LOG_LEVEL=$${ODOO_LOG_LEVEL:-info}
        export ODOO_WORKERS=$${ODOO_WORKERS:-0}
        export ODOO_CRON_THREADS=$${ODOO_CRON_THREADS:-1}
        export ODOO_LIST_DB=$${ODOO_LIST_DB:-True}
        export ODOO_LIMIT_MEMORY_HARD=$${ODOO_LIMIT_MEMORY_HARD:-2684354560}
        export ODOO_LIMIT_MEMORY_SOFT=$${ODOO_LIMIT_MEMORY_SOFT:-2147483648}
        export ODOO_LIMIT_TIME_CPU=$${ODOO_LIMIT_TIME_CPU:-60}
        export ODOO_LIMIT_TIME_REAL=$${ODOO_LIMIT_TIME_REAL:-120}
        export ODOO_LIMIT_REQUEST=$${ODOO_LIMIT_REQUEST:-8192}
        envsubst < /etc/odoo/odoo.conf.template > /tmp/odoo.conf &&
        exec odoo -c /tmp/odoo.conf
      "
    volumes:
      - odoo-data:/var/lib/odoo
      - custom-addons:/mnt/extra-addons/custom:ro
      - third-party-addons:/mnt/extra-addons/third_party:ro
      - enterprise-addons:/mnt/extra-addons/enterprise:ro
    networks:
      - odoo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  odoo-network:
    driver: bridge

volumes:
  postgres-data:
  odoo-data:
  enterprise-addons:
  third-party-addons:
  custom-addons:
